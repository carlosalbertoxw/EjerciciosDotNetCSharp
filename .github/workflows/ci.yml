name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build -warnaserror
      - run: dotnet test --no-build
      - name: Ejecutar todos los ejercicios
        run: dotnet run --no-build --project EjerciciosDotNetCSharp/EjerciciosDotNetCSharp.csproj -- --todos
